evergreen:                 # -10 points: tutorials, listicles, SEO pages and market pages, not news (regex on the title)
  points: 10
  patterns:
    - '^ep\d+\b'
    - '\[20\d\d\]'
    - '\bhow to\b'
    - '\b\d+ (steps|tips|ways|tools|best|things)\b'
    - '\bstep[- ]by[- ]step\b'
    - '\bguide to\b'
    - '\bcheat ?sheet\b'
    - '\broadmap\b'
    - '\bcourse\b'
    - '\bebitda\b'
    - '\bundervalued\b'
    - '\bprice target\b'
    - '\bexits stealth\b'
    - '\braises\b'
    - '\$[\d.]+ ?(m|mn|million|b|bn|billion)\b.*\bround\b'
    - '\b(seed|series [a-e]) (round|funding)\b'

