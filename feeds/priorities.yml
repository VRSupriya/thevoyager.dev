# 🛡️ Security watch: incidents and advisories that must never be lost to the score cut. Every fetched item
# (including dropped ones) whose title or summary matches `patterns` and mentions AI, agents or a watched
# package is listed in candidates.json "security_watch", with its score, so the editor and the security scout
# review it. OSV advisories (feeds/sources.yml: osv) are listed there too.
security_watch:
  max_items: 25
  skip_sources: [arXiv]          # papers about security are research, not incidents
  patterns: ['\bCVE-\d{4}-\d+', '\bcompromis', '\bsupply[- ]chain (attack|compromise|incident)', '\bmalicious\b', '\bbackdoor', '\bbreach',
             '\bvulnerab', '\bexploit', '\bzero-day\b', '\bRCE\b', '\bremote code execution\b', '\bcredential',
             '\bleak(ed|s)?\b', '\bsecurity (advisory|update|incident)\b', '\bprompt injection\b']
