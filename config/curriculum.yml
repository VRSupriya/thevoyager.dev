# Deep Dives curriculum: the syllabus every track follows.
#
# Week 1 = the week of start_date in config/plan.yml (Mon 5 Oct 2026). Each module is 5 theme weeks + 1 review week
# (review weeks: 6, 12, 18 … = Saturday Recap + Sunday Learning Radar only).
#
# For each theme week:
#   theme       Monday's building block, and the subject of the whole week (Tue research, Wed design, Thu interview,
#               Sat build). Friday follows the GitHub rule in config/dives-playbook.md. Sunday's Lab has its own ladder.
#   objectives  What a reader can do by Sunday. Every themed post must serve at least one of them.
#   use_case    Wednesday's end-to-end enterprise design (industry in brackets).
#
# You can edit any future week: change a theme, swap two weeks, or replace a use case. The routine reads this file
# fresh every day and never changes it.

modules:
  - id: M1
    name: "Agent and LLM app core"
    phase: "Foundations + LLM application layer"
    weeks:
      - week: 1
        done: "Serving and prefix caching; durable agents; the agent loop"
      - week: 2
        done: "Agent loop and tool calling; durable execution; recovery evaluation"
      - week: 3
        done: "Workflows vs agents; tool gateways (MCP); skill routing"
      - week: 4
        theme: "Retrieval and RAG design"
        objectives:
          - "Choose chunking, hybrid search and reranking for a given corpus, and defend the choice"
          - "Measure retrieval quality with recall@k and nDCG on a small labelled set"
          - "Recognise where plain RAG fails (multi-hop, aggregation, freshness) and what to use instead"
        use_case: "Enterprise knowledge assistant over policies and contracts (professional services)"
      - week: 5
        theme: "Evals and LLM observability"
        objectives:
          - "Build an offline eval set from real traffic and label it with domain experts"
          - "Calibrate an LLM judge against human labels and know when not to trust it"
          - "Set go-live and regression gates, and trace production requests end to end"
        use_case: "Customer-support copilot with go-live criteria (retail)"
      - week: 6
        review: true

  - id: M2
    name: "Data foundations for AI"
    phase: "Foundations + LLM application layer"
    weeks:
      - week: 7
        theme: "Ingestion and document pipelines"
        objectives:
          - "Parse messy documents (PDF, scans, tables) and measure extraction quality"
          - "Choose between batch, streaming and change data capture for keeping an index fresh"
          - "Re-index incrementally without downtime or duplicate chunks"
        use_case: "Invoice and claims processing (insurance)"
      - week: 8
        theme: "Vector, hybrid and graph retrieval"
        objectives:
          - "Explain HNSW, IVF and quantisation trade-offs and size memory and cost for an index"
          - "Combine keyword, vector and metadata filters at scale"
          - "Judge when a knowledge graph (GraphRAG) earns its extra cost"
        use_case: "Semantic product search over 50 million items (e-commerce)"
      - week: 9
        theme: "Data quality, contracts and lineage"
        objectives:
          - "Write a data contract with owners, schema and freshness targets"
          - "Trace an AI answer back to the source rows and documents it used"
          - "Classify and protect personal data before it reaches a model"
        use_case: "Text-to-SQL analytics assistant over governed data (banking)"
      - week: 10
        theme: "Identity and permission-aware access"
        objectives:
          - "Compare RBAC, ABAC and relationship-based access for AI retrieval"
          - "Keep permissions in sync between source systems and the index"
          - "Give agents scoped, auditable credentials instead of shared keys"
        use_case: "HR and legal assistant with strict access rules (enterprise HR)"
      - week: 11
        theme: "Context engineering and memory"
        objectives:
          - "Budget a context window across instructions, retrieval, history and tools"
          - "Design short-term and long-term memory, and decide what to forget"
          - "Pick a compaction strategy and measure what it loses"
        use_case: "Sales and CRM agent with long-running account memory (B2B software)"
      - week: 12
        review: true

  - id: M3
    name: "Serving, performance and cost"
    phase: "Production depth"
    weeks:
      - week: 13
        theme: "Inference serving: batching, KV cache, quantisation, GPU choice"
        objectives:
          - "Explain continuous batching, paged KV cache and where each GPU's memory goes"
          - "Choose quantisation and parallelism settings for a target model and latency"
          - "Decide between hosted APIs and self-hosted serving with numbers"
        use_case: "Self-hosted model platform for internal teams (technology company)"
      - week: 14
        theme: "Caching layers: prompt, semantic and result caching"
        objectives:
          - "Lay out prompts so provider and self-hosted prefix caches actually hit"
          - "Design a semantic cache with a safe similarity threshold and invalidation"
          - "Measure cache savings and the wrong answers a cache can cause"
        use_case: "High-volume customer FAQ assistant (airline)"
      - week: 15
        theme: "Model routing, small and on-device models, cost optimisation"
        objectives:
          - "Design a router or cascade that sends easy requests to cheaper models"
          - "Judge when a small or on-device model is good enough"
          - "Use batch and flex tiers and build a cost-per-request model"
        use_case: "Call summarisation at one million calls a month (telecom)"
      - week: 16
        theme: "Latency engineering: streaming, speculative decoding, parallel tools"
        objectives:
          - "Break end-to-end latency into its parts and find the biggest one"
          - "Apply streaming, speculative decoding and parallel tool calls where they help"
          - "Set latency budgets per step and enforce them"
        use_case: "Real-time voice agent (hospitality)"
      - week: 17
        theme: "Capacity planning and GPU economics"
        objectives:
          - "Estimate tokens, GPUs and cost for a forecast load"
          - "Plan for peaks, regions and failover capacity"
          - "Compare reserved, on-demand and API pricing over a year"
        use_case: "Code-assistant platform for 5,000 engineers (software)"
      - week: 18
        review: true

  - id: M4
    name: "Security, reliability and operations"
    phase: "Production depth"
    weeks:
      - week: 19
        theme: "AI security and threat modelling"
        objectives:
          - "Threat-model an AI system with tools (prompt injection, data exfiltration, excessive agency)"
          - "Apply layered defences and know which ones are only partial"
          - "Run red-team tests and turn findings into regression tests"
        use_case: "Customer-facing banking agent with tools (banking)"
      - week: 20
        theme: "Reliability patterns: idempotency, queues, backpressure, durable workflows"
        objectives:
          - "Make every side effect safe to retry"
          - "Use queues and backpressure to survive provider outages and rate limits"
          - "Choose between a workflow engine and a simpler queue"
        use_case: "Claims-processing agent pipeline (insurance)"
      - week: 21
        theme: "LLMOps: versioning and CI/CD for prompts and models, canary, shadow"
        objectives:
          - "Version prompts, models, tools and eval sets together"
          - "Release with canary and shadow traffic, and roll back safely"
          - "Handle a provider model deprecation without an incident"
        use_case: "Release process for a multi-team GenAI platform (retail group)"
      - week: 22
        theme: "Multi-tenancy, quotas and chargeback"
        objectives:
          - "Isolate tenants' data, prompts, caches and limits"
          - "Enforce quotas and fair sharing under load"
          - "Attribute cost per tenant and feature"
        use_case: "SaaS product with per-tenant AI features (SaaS)"
      - week: 23
        theme: "Disaster recovery, multi-region and data residency"
        objectives:
          - "Set RPO and RTO for each AI component, including indexes and memory"
          - "Design multi-region serving that respects residency rules"
          - "Plan for a model provider outage"
        use_case: "Citizen services assistant under GCC and EU residency rules (government)"
      - week: 24
        review: true

  - id: M5
    name: "Model customisation: fine-tuning, RL and your own model"
    phase: "Specialise + visibility"
    weeks:
      - week: 25
        theme: "Fine-tuning in practice: full fine-tuning, LoRA, QLoRA"
        objectives:
          - "Decide when fine-tuning beats prompting or RAG, with evidence"
          - "Prepare training data and evaluate the result against the base model"
          - "Estimate the cost of training and serving a fine-tuned model"
        use_case: "Replace a frontier-model call with a fine-tuned small model for document extraction (insurance)"
      - week: 26
        theme: "Training data, synthetic data and distillation"
        objectives:
          - "Curate and clean a training set and measure its quality"
          - "Generate synthetic data without teaching the model its own mistakes"
          - "Distil a large model into a small one, and handle data licensing"
        use_case: "Customer-care model built by distillation (telecom)"
      - week: 27
        theme: "RL fundamentals for LLMs: policy gradients, PPO, reward models, RLHF"
        objectives:
          - "Explain RLHF end to end, from preference data to policy update"
          - "Design and validate a reward model"
          - "Recognise reward hacking and over-optimisation"
        use_case: "Brand- and policy-aligned service model with a human feedback loop (retail bank)"
      - week: 28
        theme: "Modern post-training: DPO, RL with verifiable rewards, GRPO, agent RL"
        objectives:
          - "Choose between preference tuning and RL for a goal"
          - "Build reward functions that can be checked automatically"
          - "Train an agent in an environment built from real tools"
        use_case: "Maintenance agent trained on internal tools and work orders (manufacturing)"
      - week: 29
        theme: "Building your own model: pretraining, continued pretraining, tokenisers, scaling laws"
        objectives:
          - "Judge when building or continuing to pretrain a model is worth it"
          - "Plan data, tokeniser, compute and evaluation for a training run"
          - "Use scaling laws to budget model size and tokens"
        use_case: "Arabic-first or Indic-language enterprise model (national champion company)"
      - week: 30
        review: true

  - id: M6
    name: "Advanced agents"
    phase: "Specialise + visibility"
    weeks:
      - week: 31
        theme: "Planning and reflection"
        objectives:
          - "Compare plan-then-execute, ReAct and reflection loops on cost and reliability"
          - "Make plans reviewable before they run"
          - "Stop loops that are not converging"
        use_case: "Research analyst agent (asset management)"
      - week: 32
        theme: "Multi-agent coordination and A2A"
        objectives:
          - "Decide when several agents beat one agent with more tools"
          - "Design hand-offs, shared state and failure handling between agents"
          - "Use agent-to-agent protocols across organisational boundaries"
        use_case: "Procurement agents working across suppliers (logistics)"
      - week: 33
        theme: "Human-in-the-loop and approval limits"
        objectives:
          - "Place approvals where risk is, not everywhere"
          - "Design approval UX that people actually read"
          - "Measure automation rate against error rate"
        use_case: "Finance operations agent with spending limits (enterprise finance)"
      - week: 34
        theme: "Sandboxing and computer use"
        objectives:
          - "Isolate agent code execution and browser or desktop control"
          - "Limit network, file and credential access per task"
          - "Decide when computer use beats an API integration"
        use_case: "IT operations automation (managed services)"
      - week: 35
        theme: "Agent identity, registry and governance"
        objectives:
          - "Give every agent an identity, an owner and an audit trail"
          - "Run an internal registry of agents, tools and their permissions"
          - "Retire and update agents safely"
        use_case: "Group-wide AI and agent platform (energy utility)"
      - week: 36
        review: true

  - id: M7
    name: "Recommendation systems"
    phase: "Specialise + visibility"
    weeks:
      - week: 37
        theme: "Recsys foundations: retrieval then ranking, collaborative filtering, two-tower models"
        objectives:
          - "Explain the two-stage retrieval and ranking architecture"
          - "Build candidate generation with two-tower embeddings"
          - "Handle cold start for new users and items"
        use_case: "Homepage recommendations (e-commerce)"
      - week: 38
        theme: "Ranking and features: feature stores, learning to rank, deep ranking models"
        objectives:
          - "Design features and keep training and serving consistent"
          - "Choose a ranking model and loss for the business goal"
          - "Run a feature store in production"
        use_case: "News and content feed ranking (media)"
      - week: 39
        theme: "Real-time recommendations: session models, event pipelines, freshness"
        objectives:
          - "Build a streaming feature pipeline"
          - "React to what a user did seconds ago"
          - "Meet tight latency budgets at peak"
        use_case: "Real-time recommendations in a delivery app (logistics and food delivery)"
      - week: 40
        theme: "LLMs and generative recommenders: semantic IDs, LLM ranking, conversational recommendations"
        objectives:
          - "Judge where LLMs genuinely improve recommendations"
          - "Explain semantic IDs and generative retrieval"
          - "Keep LLM-based ranking within latency and cost limits"
        use_case: "Conversational shopping assistant (retail)"
      - week: 41
        theme: "Evaluation and experimentation: offline metrics, A/B tests, interleaving, bandits"
        objectives:
          - "Design an experiment that measures business impact"
          - "Avoid popularity feedback loops and unfair exposure"
          - "Use bandits where A/B tests are too slow"
        use_case: "Experimentation platform for a streaming service (media streaming)"
      - week: 42
        review: true

  - id: M8
    name: "Enterprise solution architecture"
    phase: "Specialise + visibility"
    weeks:
      - week: 43
        theme: "Regulation and governance: EU AI Act, UAE and KSA rules, India DPDP, model risk"
        objectives:
          - "Classify a system's risk under the EU AI Act and list the duties that follow"
          - "Map data residency and privacy rules to architecture decisions"
          - "Set up model risk management that auditors accept"
        use_case: "Clinical documentation assistant (healthcare)"
      - week: 44
        theme: "Integrating with legacy systems: APIs, events, mainframe, replacing RPA"
        objectives:
          - "Connect AI to systems of record without breaking them"
          - "Choose between APIs, events and batch for each integration"
          - "Plan a strangler-style migration away from RPA scripts"
        use_case: "Core-system modernisation with AI (insurance)"
      - week: 45
        theme: "Responsible AI: fairness, explainability, content safety, AI policy"
        objectives:
          - "Measure and reduce unfair outcomes"
          - "Explain AI decisions to users, auditors and regulators"
          - "Turn an AI policy into enforceable technical controls"
        use_case: "Credit and hiring decisions with human review (financial services and HR)"
      - week: 46
        theme: "Multimodal pipelines: vision, speech, video"
        objectives:
          - "Design pipelines for images, audio and video at scale"
          - "Choose between multimodal models and specialised ones"
          - "Control the cost of multimodal processing"
        use_case: "Field-service inspection from photos (utilities and infrastructure)"
      - week: 47
        theme: "Platform strategy, build vs buy, multi-cloud"
        objectives:
          - "Decide what to build, buy or assemble, and when to revisit it"
          - "Avoid lock-in with gateways and portable data"
          - "Run AI across more than one cloud without doubling the work"
        use_case: "Group-wide AI platform for a conglomerate (diversified group)"
      - week: 48
        review: true

  - id: M9
    name: "Capstones"
    phase: "Interviews + applications"
    note: "Each week is one full reference architecture. Monday revisits the building blocks it needs; Thursday is a full mock interview round on it."
    weeks:
      - week: 49
        theme: "Capstone: enterprise knowledge platform (M1, M2)"
        objectives:
          - "Combine retrieval, evals, ingestion, permissions and memory into one design"
          - "Defend every major decision with an ADR"
          - "Present it in 10 minutes to a mixed audience"
        use_case: "Enterprise knowledge platform (professional services)"
      - week: 50
        theme: "Capstone: contact-centre AI, voice and text (M3)"
        objectives:
          - "Design for latency, cost and peak load together"
          - "Plan capacity and cost for a year"
          - "Present trade-offs to a CTO and a CFO"
        use_case: "Contact-centre AI (telecom)"
      - week: 51
        theme: "Capstone: regulated banking agent platform (M4, M6, M8)"
        objectives:
          - "Combine security, agents, approvals and regulation in one design"
          - "Pass a mock architecture review"
          - "Write the risk register and operating model"
        use_case: "Regulated banking agent platform (banking)"
      - week: 52
        theme: "Capstone: own-model platform (M5)"
        objectives:
          - "Plan fine-tuning, alignment, serving and evaluation for a domain model"
          - "Justify the investment against API alternatives"
          - "Design the retraining loop"
        use_case: "Domain model platform (healthcare or legal)"
      - week: 53
        theme: "Capstone: personalised commerce (M7)"
        objectives:
          - "Combine recommendations with an LLM assistant"
          - "Design the experiment that proves value"
          - "Plan real-time features and serving"
        use_case: "Personalised commerce platform (retail)"
      - week: 54
        review: true

  - id: M10
    name: "Architect leadership"
    phase: "Interviews + applications"
    note: "Tuesday uses a study, survey or well-known postmortem instead of a paper; Saturday produces an artefact (ADR, roadmap, business case) instead of code."
    weeks:
      - week: 55
        theme: "Running design reviews and writing ADRs"
        objectives:
          - "Run a design review that finds real problems"
          - "Write ADRs people read and follow"
          - "Review someone else's design constructively"
        use_case: "Architecture review board for AI projects (enterprise)"
      - week: 56
        theme: "Cost ownership and FinOps for AI"
        objectives:
          - "Own an AI budget and forecast it"
          - "Set unit economics targets and track them"
          - "Cut cost without cutting quality"
        use_case: "AI FinOps for a multi-product company (SaaS)"
      - week: 57
        theme: "Business cases and stakeholder management"
        objectives:
          - "Write a business case with value, cost and risk"
          - "Map stakeholders and what each needs to say yes"
          - "Handle a sceptical executive"
        use_case: "Business case for an AI programme (manufacturing)"
      - week: 58
        theme: "Technical roadmaps and platform adoption"
        objectives:
          - "Build a 12-month roadmap with clear bets"
          - "Drive adoption of a platform across teams"
          - "Measure whether the platform is working"
        use_case: "Roadmap for an internal AI platform (retail group)"
      - week: 59
        theme: "Architecture governance, mentoring and delegation"
        objectives:
          - "Set standards without becoming a bottleneck"
          - "Mentor engineers into architects"
          - "Delegate design work and keep quality"
        use_case: "AI centre of excellence operating model (enterprise)"
      - week: 60
        review: true

# Weeks 61–64: spare. Use them to catch up, repeat a weak module, or add a capstone. Until you fill them in, the
# routine treats them as review weeks.
