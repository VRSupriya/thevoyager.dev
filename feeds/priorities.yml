# One pick per slot, filled in this order, so a niche slot is not starved by "top".
# strict: true = no fallback to other sources (the slot stays empty if nothing matches)
# prefer.kinds: news | source | people | youtube     prefer.sources: exact source names (substring match)
slots:
  top:
    note: best overall by score
  models:
    require_match: true    # no model/feature news matched -> pick is empty and the routine searches for it
    prefer:
      sources: [OpenAI, Anthropic, DeepMind, Google AI Blog, Meta AI, Hugging Face Blog]
      keywords: [model, release, launch, pricing, context window, open weights, open-weight, embedding model, reranker, ocr model, speech model]
  agents:
    require_match: true
    prefer:
      keywords: [agent, agentic, mcp, a2a, tool use, orchestration, sandbox, gateway, guardrail, prompt injection, coding agent, claude code, codex, cursor, copilot, harness, subagent]
  research:
    strict: true           # only from the listed sources; otherwise empty, and the routine searches for a paper
    prefer:
      sources: [HF Daily Papers, arXiv, Google Research, Hugging Face Blog, Yannic, Albanie, Gordić]
      keywords: [paper, arxiv, we propose, benchmark, ablation, training]
  people:
    strict: true
    prefer:
      kinds: [people]
      note: only from feeds/people.yml
  architecture:
    prefer:
      sources: [InfoQ, Pragmatic Engineer, Uber, Databricks, AWS News Blog, Microsoft Foundry]
      keywords: [architecture, system design, platform, scaling, reliability, case study, data pipeline, inference, observability, evals, security, in production, llm, agent, model serving, gpu]

# ⚡ Also worth knowing: good candidates that did not win a slot, grouped for the quick-hits list.
# An item goes to the first category whose keywords it matches; at most `per_category` each.
quick_hits:
  per_category: 6
  min_score: 9
  categories:
    security_governance:
      label: "🛡️ Security & governance"
      keywords: [vulnerability, cve, prompt injection, jailbreak, exfiltration, breach, advisory, supply chain, malicious, red team,
                 ai act, regulation, regulator, nist, iso 42001, dpdp, compliance, governance, ai policy, sovereign, copyright, audit]
    deadlines:
      label: "⏰ Deprecations & deadlines"
      keywords: [deprecat, retire, retirement, end of life, end of support, sunset, shut down, shutdown, breaking change, migration deadline, will be removed]
    models_tools:
      label: "🧰 Models & tools"
      keywords: [model, open weights, open-weight, release, sdk, api, open source, open-source, library, framework, cli, agent, mcp, inference, coding]
    platforms_enterprise:
      label: "🏢 Platforms & enterprise"
      keywords: [bedrock, vertex, azure, foundry, agentcore, databricks, snowflake, salesforce, agentforce, servicenow, workday, sap, oracle,
                 enterprise, generally available, customer, in production, case study, adoption, platform]
    research:
      label: "🔬 Research"
      keywords: [paper, arxiv, benchmark, we propose, preprint, study]

# 🆕 Newcomers (feeds/sources.yml: discovery). Only AI-related, recent, not-yet-covered things are kept.
newcomers:
  model_max_age_days: 10        # a model (open or hosted) counts as new for this long (matches the brief's 10-day freshness rule)
  release_max_age_days: 7
  other_max_age_days: 3         # Show HN, Product Hunt
  hf_min_likes: 60              # Hugging Face: skip tiny personal uploads
  per_kind: 10                  # at most this many per kind in candidates.json
  ai_terms: [ai, llm, llms, gpt, agent, agents, agentic, mcp, rag, model, models, inference, embedding, embeddings, transformer,
             diffusion, claude, openai, anthropic, gemini, llama, qwen, deepseek, mistral, ml, neural, vlm, ocr, speech, tts,
             copilot, codex, cursor, prompt, vector, fine-tune, fine-tuning, lora, eval, evals, gguf, vllm, ollama]
  skip_patterns: ['uncensored', 'abliterated', '\bgguf\b', '-gguf', 'quantized', '\blora\b', '\bmerge\b', 'nsfw']

# Step 6 coverage check: every item from these sources in the last `hours`, unfiltered by score,
# so the editor can confirm the brief didn't miss what the rest of the AI world covered.
coverage:
  hours: 48                   # TLDR and The Rundown publish on US time, after the morning run
  per_source: 12
  sources: ["swyx / Latent Space", "TLDR AI", "The Rundown AI", "Last Week in AI", "Hacker News", "r/LocalLLaMA"]
