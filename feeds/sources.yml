  - {section: core, name: GitHub Changelog,    url: https://github.blog/changelog/feed/, weight: 2}   # Copilot features, model retirements
  - {section: core, name: AWS ML Blog,         url: https://aws.amazon.com/blogs/machine-learning/feed/, weight: 1}
