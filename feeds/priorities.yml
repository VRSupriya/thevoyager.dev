# What the Daily Brief should favour. Read by scripts/fetch_feeds.py.
# Audience: senior AI / solution architects, senior AI engineers, forward deployed engineers.
#
# score = source weight (1-3) x weight_points
#       + relevance keywords found in title/summary (boost) - noise keywords (penalty)
#       + small bonuses for engagement and freshness
# Items below min_score are dropped, so off-topic stories never reach the routine.
# Edit the lists freely: one word or phrase per entry, matched case-insensitively.

weight_points: 5           # a weight-3 source starts at 15, weight-1 at 5 (was 10: source prestige drowned out the news)
min_score: 9               # below this = dropped as not relevant enough
repeat_days: 3              # vendor cap: a company or product featured in the brief this recently...
repeat_penalty: 8           # ...loses this many points (the routine also limits it to one item, see the prompt)
repeat_exempt: [mcp, a2a, rag, gpu, llm, api, sdk, code, space, runtime, console, hybrid, reasoning, arabic, studio, mac, sensor, threshold, crossing, latent, open, agent, agents]
trend_bonus: 6             # added when a title names a trending topic (see "trending" in candidates.json)
domain_cap: 2              # max items from one website among the picks (the final shortlist)
alternates_per_slot: 3     # runners-up offered next to each pick
unverifiable_kinds: [youtube]   # WebFetch cannot read YouTube pages, so these are never a pick (alternates only, flagged)

