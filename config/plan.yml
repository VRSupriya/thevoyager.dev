start_date: 2026-10-05        # the Monday Deep Dives starts (week 1 = Mon 5 – Sun 11 Oct)
ramp:
  - weeks: [1, 999]
    days: [Mon, Tue, Wed, Thu, Fri, Sat, Sun]   # every day from week 1 (was a gentle 3 -> 5 -> 7 days ramp)
review_week_every: 6          # in weeks 6, 12, 18…: Saturday Recap post + Sunday Learning Radar only (each ends a module)
phases:                       # by week of the plan (week 1 = start_date); weekly themes are in config/curriculum.yml
  - {weeks: [1, 12],  name: "Foundations + LLM application layer"}
  - {weeks: [13, 24], name: "Production depth"}
  - {weeks: [25, 54], name: "Specialise + visibility"}
  - {weeks: [55, 66], name: "Interviews + applications"}
